# Model Arena (PROJECT_CONTEXT §10.1, D14): race rules and arena rendering.

race:
  laps: 3
  grid_gap_m: 8.0             # distance between grid rows (2 cars per row)
  grid_lateral_frac: 0.45     # grid slots at ±45 % of the half width
  countdown_s: 3.0
  respawn_s: 1.0              # a crashed car waits this long, then restarts from standstill
  finish_timeout_s: 30.0      # the race ends this long after the winner (or when all finish)

max_cars: 20
fair_physics: default         # physics preset for --fair (everyone on the same physics)

# 20 distinct body colours (car shapes cycle 1–4); RGB 0–255.
palette:
  - [230, 57, 70]
  - [69, 123, 230]
  - [42, 191, 108]
  - [255, 183, 3]
  - [155, 89, 214]
  - [255, 120, 40]
  - [0, 200, 210]
  - [240, 100, 180]
  - [140, 200, 40]
  - [250, 250, 250]
  - [120, 70, 40]
  - [30, 60, 140]
  - [200, 30, 120]
  - [90, 90, 90]
  - [255, 230, 90]
  - [0, 120, 90]
  - [180, 140, 255]
  - [255, 160, 150]
  - [60, 160, 255]
  - [170, 0, 20]

label_font_size: 14
label_offset_m: 4.0           # car label drawn this far above the car
leaderboard_width: 460
trail_length: 240             # substeps of trail per car (4 s)
selected_trail_length: 900    # longer trail for the followed car
swarm:                        # swarm view (T132): one policy, many cars scattered over the track
  default_cars: 24
  max_cars: 60
  laps: 50              # a swarm never finishes; this only sizes the timing tables
  speed_max_ms: 15.0
  lateral_frac: 0.6
  leaderboard_rows: 10
effects:                      # skid marks, smoke, dust, crash sparks (T129); E toggles them
  default_on: true
  max_particles: 700
  max_skid_segments: 6000     # marks are baked into the world surface, so they last for the race
  skid_min_speed_ms: 4.0
  dust_min_speed_ms: 7.0
  dust_rate: 0.5          # particles per wheel per 1/60 s
  dust_life_s: 1.1
  smoke_rate: 0.8
  smoke_life_s: 1.3
  crash_sparks: 28
  crash_shake_m: 1.5
brain:                        # brain panel of the followed car (T128); B toggles it
  default_on: true
  width: 640
  height: 300
  smoothing: 0.45             # 0 = instant colours, towards 1 = slow (avoids flicker at 20 Hz decisions)
human:                        # Human vs AI (T127)
  physics: default            # your car's physics preset unless you pick another (Shift+C)
  deadzone: 0.15              # gamepad stick / trigger dead zone
  pad_axes: {steer: 0, gas: 5, brake: 4}      # SDL2 Xbox layout: left stick X, right and left trigger
  pad_buttons: {gas: 0, brake: 1}             # A, B
  abs:                        # keyboard braking is all-or-nothing: cap it inside the grip limit (as drive.py)
    enabled: true
    margin: 0.97
    min_brake: 0.25
credits: "Engine sound: Delorean DMC-12 V6 PRV engine by skyernaklea (freesound.org/s/623436), CC BY 4.0, edited. Tyres: johnnydekk (CC0). Sprites: Kenney (CC0). Textures: ambientCG (CC0). Fonts: SIL OFL 1.1."   # CC BY 4.0 needs this on the title screen
show_keys_at_start: true      # key list (bottom right) shown when a race starts; H hides/shows it (T82)
