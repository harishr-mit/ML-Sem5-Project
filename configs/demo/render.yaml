# Rendering settings (PROJECT_CONTEXT §10). Colours are RGB(A) 0–255.

# Minimal debug renderer (racer/render/debug_view.py, scripts/drive.py).
debug:
  window: [1280, 800]
  fps: 60
  world_px_per_m: 6.0         # resolution of the pre-rendered track surface (4 is faster to build, 6 is crisper at the default zoom)
  zoom_px_per_m: 8.0          # initial camera zoom
  zoom_min: 0.5
  zoom_max: 20.0
  zoom_step: 1.15             # per key press
  camera_lerp: 0.12           # fraction of the gap to the car closed per frame
  camera_lead_s: 0.4          # camera looks this many seconds ahead of the car
  kerb_stripe_m: 3.0          # length of each red / white kerb stripe
  centreline_dash_m: 4.0
  start_square_m: 1.0         # chequered start/finish line square size
  trail_length: 900           # substeps kept in the trail (15 s at 60 Hz)
  trail_speed_max: 70.0       # m/s mapped to the hottest trail colour
  banner_s: 1.5               # how long the termination banner shows before the reset
  # ABS assist for keyboard braking (human mode only; physics and models are unaffected).
  # A key is all-or-nothing, so full brake would lock the wheels; ABS caps the brake just
  # inside the friction circle instead.
  abs:
    enabled: true             # initial state; toggle with K
    margin: 0.97              # fraction of the available grip to use
    min_brake: 0.25           # never brake less than this while the key is held (even mid-slide)
  # Ground textures (assets/textures/ground, tile sizes from assets/LICENSES.md) and trackside scenery. The
  # photographic textures are darkened and desaturated to sit next to Kenney's flat sprites. enabled: false (or a
  # missing file) falls back to the flat colours below.
  textures:
    enabled: true
    ground:
      grass:   {file: grass.jpg,   tile_m: 8.0,  darken: 0.30, desaturate: 0.25}
      gravel:  {file: gravel.jpg,  tile_m: 4.0,  darken: 0.32, desaturate: 0.20}
      asphalt: {file: asphalt.jpg, tile_m: 6.0,  darken: -1.00, desaturate: 0.15}   # the photo is very dark: brightened x2
    outside_darken: 0.38        # grass beyond the barrier is darker, so the scenery stands out
    gravel_band_m: 5.0          # run-off next to the road is gravel (visual only: it is grass physics)
    edge_line_m: 0.28           # white line along the road edge (not on kerbs)
    edge_line_colour: [214, 214, 208]
    barrier_a: [226, 226, 230]
    barrier_b: [196, 48, 48]
    barrier_block_m: 4.0
    variation: {cell_m: 45.0, strength: 0.10}   # slow brightness drift that hides the tiling
  scenery:
    enabled: true
    spacing_m: 24.0             # one placement attempt per side every this many metres
    barrier_gap_m: 2.5          # nothing closer than this to the barrier
    straight_curvature: 0.004   # |1/radius| below this counts as a straight
    grandstand_span_m: 120.0    # grandstands within this distance of the start line
    grandstand_width_m: 22.0
    grandstand_depth_m: 10.0
    grandstand_gap_m: 1.5
    tyre_wall_chance: 0.45      # on the outside of corners
    tent_chance: 0.10
    tree_chance: 0.55
    tree_clump: 3
    tree_depth_m: 14.0
    shadow_m: 0.9               # drop shadow offset
    shadow_alpha: 90
  sim_speeds: [0.25, 0.5, 1.0, 2.0, 4.0]
  car_sprite: car_1_blue.png  # in assets/sprites/cars/; falls back to a rectangle
  font: share_tech_mono.ttf   # in assets/fonts/; falls back to pygame's default font
  font_size: 17
  colours:
    outside: [30, 32, 36]
    grass: [62, 110, 55]
    road: [88, 88, 94]
    kerb_red: [196, 42, 42]
    kerb_white: [232, 232, 232]
    wall: [215, 215, 220]
    centreline: [150, 150, 160]
    start_light: [240, 240, 240]
    start_dark: [25, 25, 25]
    car: [40, 140, 255]
    car_outline: [10, 20, 40]
    hud_text: [235, 235, 235]
    hud_dim: [150, 155, 165]
    hud_bg: [10, 12, 16, 170]
    hud_good: [90, 220, 120]
    hud_bad: [240, 90, 80]
    steer_bar: [90, 170, 255]
    gas_bar: [90, 220, 120]
    brake_bar: [240, 90, 80]
    abs_active: [255, 190, 60]
