# Environment preset "rays5" (PROJECT_CONTEXT §7). The default observation spec.
#
# obs_spec v1 is FROZEN once a model has been saved with it: never change what these
# fields mean. A new feature needs a new version (§9, §15). Values here may differ
# between presets (e.g. ray list), but their meaning is defined by the version.

obs_spec:
  version: 1
  name: rays5
  # Angles are counter-clockwise from the car's heading (−90 = right side).
  rays:
    - {angle_deg: -90.0, range_m: 60.0}
    - {angle_deg: -45.0, range_m: 60.0}
    - {angle_deg: 0.0, range_m: 200.0}
    - {angle_deg: 45.0, range_m: 60.0}
    - {angle_deg: 90.0, range_m: 60.0}
  extras: [heading_sincos, v_long, v_lat, yaw_rate, onroad_frac, prev_action]
  scales:
    v_long: 70.0              # m/s
    v_lat: 10.0               # m/s
    yaw_rate: 3.0             # rad/s

# Ray marching (implementation detail; does not change what a ray measures).
raycast:
  hit_eps_m: 0.02             # a ray starting this close to the road edge returns 0
  min_step_m: 0.25            # minimum march step at the ray origin...
  min_step_growth: 0.02       # ...growing by this fraction of the distance travelled
  max_iters: 128
  bisect_iters: 8             # refine a crossing that a step jumped over

episode:
  agent_hz: 20                # decisions per second; physics_hz / agent_hz substeps per action
  start_lateral_max_m: 2.0    # random lateral offset at the start
  start_heading_max_deg: 10.0 # random heading offset at the start
  start_speed_min: 0.0
  start_speed_max: 15.0
  offroad_limit_s: 1.0        # all 4 wheels off the road for longer than this → terminate
  noprogress_window_s: 3.0    # less than noprogress_min_m in this window → terminate
  noprogress_min_m: 2.0
  wrongway_deg: 110.0         # heading error beyond this...
  wrongway_limit_s: 1.0       # ...for longer than this → terminate
  max_laps: 2                 # truncate after this many laps of net progress
  max_steps: 4000             # truncate after this many agent steps
