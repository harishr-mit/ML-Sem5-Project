# Experiment E4 (PROJECT_CONTEXT §11): the forward ray only sees 60 m (instead of 200 m),
# too short to brake from top speed. obs_spec v1, 13 dims.
extends: rays5
obs_spec:
  name: rays5_short
  rays:
    - {angle_deg: -90.0, range_m: 60.0}
    - {angle_deg: -45.0, range_m: 60.0}
    - {angle_deg: 0.0, range_m: 60.0}
    - {angle_deg: 45.0, range_m: 60.0}
    - {angle_deg: 90.0, range_m: 60.0}
