# Environment preset "rays7_narrow" (PROJECT_CONTEXT §7.1, D21): obs_spec v2.
#
# Shallow rays (±7°, ±20°) run nearly along the road, so the agent sees a bend 35–70 m
# earlier than with rays5's ±45° rays (which hit the edge of a 12 m road after ~8.5 m).
# Wide rays (±60°) still see the edges beside the car. 7 + 8 = 15 inputs.
#
# v2 presets are standalone (strict merging can't turn a v1 spec into a v2 one), so the
# raycast and episode sections are copied from rays5.

obs_spec:
  version: 2
  name: rays7_narrow
  features:
    - feature: rays
      rays:
        - {angle_deg: -60.0, range_m: 60.0}
        - {angle_deg: -20.0, range_m: 120.0}
        - {angle_deg: -7.0, range_m: 200.0}
        - {angle_deg: 0.0, range_m: 200.0}
        - {angle_deg: 7.0, range_m: 200.0}
        - {angle_deg: 20.0, range_m: 120.0}
        - {angle_deg: 60.0, range_m: 60.0}
    - {feature: heading_sincos}
    - {feature: v_long, scale: 70.0}        # m/s
    - {feature: v_lat, scale: 10.0}         # m/s
    - {feature: yaw_rate, scale: 3.0}       # rad/s
    - {feature: onroad_frac}
    - {feature: prev_action}

action_spec:
  layout: steer_gas

# Ray marching (implementation detail; does not change what a ray measures).
raycast:
  hit_eps_m: 0.02
  min_step_m: 0.25
  min_step_growth: 0.02
  max_iters: 128
  bisect_iters: 8

episode:
  agent_hz: 20
  start_lateral_max_m: 2.0
  start_heading_max_deg: 10.0
  start_speed_min: 0.0
  start_speed_max: 15.0
  offroad_limit_s: 1.0
  noprogress_window_s: 3.0
  noprogress_min_m: 2.0
  wrongway_deg: 110.0
  wrongway_limit_s: 1.0
  max_laps: 2
  max_steps: 4000
