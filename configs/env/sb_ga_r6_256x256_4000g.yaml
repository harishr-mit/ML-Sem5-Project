# Environment preset 'sb_ga_r6_256x256_4000g', written by the AI Sandbox (T71) for run tag 'ga_r6_256x256_4000g'.
# obs_spec v2 (D21), standalone. Untracked files don't block real runs (D12); commit it to keep
# the preset with the code (the model's snapshot stores the full spec anyway).
obs_spec:
  version: 2
  name: sb_ga_r6_256x256_4000g
  features:
  - feature: rays
    rays:
    - angle_deg: -25.0
      range_m: 60.0
    - angle_deg: -7.0
      range_m: 60.0
    - angle_deg: -1.0
      range_m: 200.0
    - angle_deg: 1.0
      range_m: 200.0
    - angle_deg: 7.0
      range_m: 80.0
    - angle_deg: 15.0
      range_m: 60.0
  - feature: heading_sincos
  - feature: v_long
    scale: 70.0
  - feature: onroad_frac
  - feature: accel_g
    scale_ms2: 12.0
  - feature: history
    steps: 5.0
    stride: 1.0
    of:
    - heading_sincos
    - v_long
    - onroad_frac
    - accel_g
action_spec:
  layout: steer_gas
raycast:
  hit_eps_m: 0.02
  min_step_m: 0.25
  min_step_growth: 0.02
  max_iters: 128
  bisect_iters: 8
episode:
  agent_hz: 20
  start_lateral_max_m: 2.0
  start_heading_max_deg: 10.0
  start_speed_min: 0.0
  start_speed_max: 15.0
  offroad_limit_s: 1.0
  noprogress_window_s: 3.0
  noprogress_min_m: 2.0
  wrongway_deg: 110.0
  wrongway_limit_s: 1.0
  max_laps: 2
  max_steps: 4000
