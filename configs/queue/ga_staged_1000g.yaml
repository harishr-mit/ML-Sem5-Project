# Staged GA fitness (D32): R027's setup (6 rays, 256x256, train7, seed 2, 20 % elites, 4 workers), 1000 generations,
# patience = the cap. Lap fraction until 5 of 50 cars finish in 90 % of the last 100 generations, then the lap-time score.
# Run: .venv\Scripts\python scripts\queue_overnight.py configs\queue\ga_staged_1000g.yaml
parallel: 1
runs:
- name: ga_staged_6r_1000g_s2
  args:
  - --tag
  - ga_staged_6r_1000g_s2
  - --trackset
  - train7
  - --env
  - sb_ga_r6_256x256_4000g
  - --train
  - ga_staged
  - --physics
  - default
  - --reward
  - progress
  - --generations
  - '1000'
  - --seed
  - '2'
  - --set
  - ga.elite_frac=0.2
  - --set
  - ga.workers=4
  - --set
  - ga.validation.patience=1000
  - --curriculum
  - AI Sandbox
  - --notes
  - 'Staged GA fitness (D32): R027 setup (6 rays, 256x256, train7, seed 2) with lap fraction until 5 of 50 cars finish in 90 % of the last 100 generations, then the lap-time score (fail_speed_frac 0.1, to review). R027 (lap-time score from generation 0) never finished a lap.'
