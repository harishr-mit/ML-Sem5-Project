# R029 parameters, minimal inputs (9), 256x256, train7, seed 2, 20 % elites,
# 4 workers, 1000 generations, patience = the cap. fail_speed_frac stays 0.1 (preset).
# Run: .venv\Scripts\python scripts\queue_overnight.py configs\queue\ga_staged_min9_1000g.yaml
parallel: 1
runs:
- name: ga_staged_min9_1000g_s2
  args:
  - --tag
  - ga_staged_min9_1000g_s2
  - --trackset
  - train7
  - --env
  - sb_ga_min9
  - --train
  - ga_staged
  - --physics
  - default
  - --reward
  - progress
  - --generations
  - '1000'
  - --seed
  - '2'
  - --set
  - ga.elite_frac=0.2
  - --set
  - ga.workers=4
  - --set
  - ga.validation.patience=1000
  - --curriculum
  - AI Sandbox
  - --notes
  - 'Staged GA fitness (D32), R029 parameters with minimal inputs: 6 symmetric rays + heading + forward speed (9), no previous inputs, 1000 generations, patience 1000. Compare with R029.'
