# T50 queue (log.md, owner decisions 2026-10-11): faster models on the map library.
#   .venv\Scripts\python scripts\queue_overnight.py configs\queue\t50.yaml
#
# Both runs train from scratch on maps7 (7 training maps + generated tracks) for 5M steps
# and are evaluated with protocol v2. Target: lap_ratio < 1.0 and unseen_completion ≥ 80 %.
# The only difference is the ray layout (both have shallow rays that see bends early).
# ≈ 2 × (50 min training + 10 min evaluation).

runs:
  - name: t50_narrow7_s1
    args: >-
      --tag t50_narrow7_s1 --trackset maps7 --env rays7_narrow --steps 5000000 --seed 1
      --curriculum "T50: 7 narrow rays on maps7"
      --notes "Shallow rays (±7°, ±20°) see bends 35-70 m earlier than the ±45° rays of rays5; maps7 adds tight corners. Goal: faster than the baseline and unseen completion >= 80 %."
  - name: t50_rays9_s1
    args: >-
      --tag t50_rays9_s1 --trackset maps7 --env rays9 --steps 5000000 --seed 1
      --curriculum "T50: 9 rays on maps7"
      --notes "rays9 generalised best overnight (R014: 69 % unseen on v2). Same spec, trained on maps7 with tight corners."
