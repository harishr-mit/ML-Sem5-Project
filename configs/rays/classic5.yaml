# Five rays, the original set: both sides, two diagonals and one long one straight ahead. Simple, but the diagonals hit the road edge after only ~8 m, so bends are seen late.
rays:
  - {angle_deg: -90.0, range_m: 60.0}
  - {angle_deg: -45.0, range_m: 60.0}
  - {angle_deg: 0.0, range_m: 200.0}
  - {angle_deg: 45.0, range_m: 60.0}
  - {angle_deg: 90.0, range_m: 60.0}
