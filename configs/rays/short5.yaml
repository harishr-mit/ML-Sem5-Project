# Five rays that only see 60 m ahead. A deliberately weak sensor: the car brakes late and drives slowly (experiment E4).
rays:
  - {angle_deg: -90.0, range_m: 60.0}
  - {angle_deg: -45.0, range_m: 60.0}
  - {angle_deg: 0.0, range_m: 60.0}
  - {angle_deg: 45.0, range_m: 60.0}
  - {angle_deg: 90.0, range_m: 60.0}
