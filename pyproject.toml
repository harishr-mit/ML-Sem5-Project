[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racer"
version = "0.1.0"
description = "RL Racing Line: a 2D racing sim where a PPO agent learns a racing line"
requires-python = ">=3.11"
# Dependencies are managed in requirements.txt (torch comes from the CPU index; see README).
dependencies = []

[tool.setuptools.packages.find]
include = ["racer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
