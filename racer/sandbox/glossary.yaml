# AI Sandbox glossary (T67): what every parameter is and what it affects.
# Keys use the sandbox namespace (racer/sandbox/explain.py): physics.*, reward.*, env.*,
# tracks.*, track.*, presets.*, train.*, manifest.*, run.*, metric.*. Wildcards allowed.
# Fields: short (what it is), affects (what changing it does), range (typical values),
# related (experiment or decision). Observation features, action layouts and algorithms are
# described in their code registries (features.py, actions.py, algorithms.py), not here.
# tests/test_sandbox.py fails if any preset or saved snapshot has a key without an entry.

car:
  title: The car (physics)
  intro: "Arcade-sim physics (PROJECT_CONTEXT §5): momentum, a grip limit per surface, engine power and drag. The racing line exists because corners taken too fast make the car slide."
  keys:
    physics.physics_hz:
      short: "Physics steps per second."
      affects: "Simulation accuracy versus speed. The agent decides every 3rd step (agent_hz 20)."
      range: "60"
    physics.mass_kg:
      short: "Car mass (kg)."
      affects: "Acceleration and braking for a given force, and momentum when sliding. Without downforce it does not change the maximum cornering g: grip and inertia both grow with mass."
      range: "800–1500"
    physics.gravity:
      short: "Gravity (m/s²)."
      affects: "Normal force, so the grip available: max tyre force = μ·m·g."
      range: "9.81"
    physics.wheelbase_m:
      short: "Distance between front and rear axles (m)."
      affects: "Turning radius for a given wheel angle (R = L / tan δ): a longer car turns more slowly."
      range: "2.4–3.0"
    physics.car_length_m:
      short: "Body length (m)."
      affects: "The car's outline: drawing and body corners. Not part of the grip model."
    physics.car_width_m:
      short: "Body width (m)."
      affects: "The car's outline: drawing and body corners. Not part of the grip model."
    physics.wheel_track_m:
      short: "Distance between the left and right wheels (m)."
      affects: "Where the 4 wheels sample the surface: a wider track puts wheels on the grass sooner."
    physics.max_steer_low_deg:
      short: "Steering lock at standstill (degrees)."
      affects: "How tight the car can turn at low speed (hairpins)."
      range: "25–35"
    physics.max_steer_high_deg:
      short: "Steering lock at and above steer_fade_speed (degrees)."
      affects: "Limits how hard the car can turn at speed; more lock makes high-speed driving twitchy."
      range: "6–12"
    physics.steer_fade_speed:
      short: "Speed (m/s) at which the steering lock has faded from the low- to the high-speed value."
      affects: "Lower = steering is limited earlier."
    physics.steer_rate_deg_s:
      short: "How fast the front wheels can turn (degrees per second)."
      affects: "Lower = smoother but slower reactions, so the agent has to turn in earlier."
      range: "90–180"
    physics.engine_force_max:
      short: "Maximum driving force at low speed (N)."
      affects: "Launch acceleration (6000 N on 1000 kg ≈ 0.6 g)."
    physics.engine_power_max:
      short: "Engine power limit (W): driving force ≤ power / speed."
      affects: "Acceleration at speed and, with drag, the top speed (≈ 68 m/s with the defaults)."
      range: "100–200 kW"
    physics.min_drive_speed:
      short: "Speed floor (m/s) in power / speed."
      affects: "Keeps the power-limited force finite at standstill. Technical."
    physics.brake_force_max:
      short: "Maximum braking force (N)."
      affects: "Full brake (12000 N) exceeds road grip (≈ 10800 N), so it locks the wheels and the car stops on the lower kinetic grip. Braking at ≈ 90 % (threshold braking) stops shortest: part of the skill the agent learns."
    physics.brake_min_speed:
      short: "Below this forward speed (m/s) the brakes do nothing."
      affects: "There is no reverse gear: braking can't make the car go backwards."
    physics.stop_speed:
      short: "When coasting or braking below this speed (m/s), the car is set to rest."
      affects: "Stops endless creeping at near-zero speed. Technical."
    physics.air_density:
      short: "Air density ρ (kg/m³) in the drag formula."
      affects: "Drag = ½·ρ·CdA·v²."
      range: "1.225"
    physics.cda_m2:
      short: "Drag area CdA (m²)."
      affects: "Air resistance; with the power limit it sets the top speed."
      range: "0.6–0.9"
    physics.c_lat:
      short: "Fraction of sideways sliding removed each physics step, when grip allows."
      affects: "How planted the tyres feel. Lower = the car keeps drifting longer."
      range: "0.5–1.0"
    physics.k_down:
      short: "Downforce coefficient (N·s²/m²): extra normal force k·v²."
      affects: "More grip at high speed, so fast corners can be taken faster than slow ones (E9). 0 = no downforce."
      range: "0 (default), 1.5 (downforce preset)"
      related: E9
    physics.sliding_threshold:
      short: "If the friction circle cuts the tyre forces below this fraction, the car counts as sliding."
      affects: "Sliding switches to kinetic grip on the next step and draws skid marks."
    physics.surfaces.*.mu_static:
      short: "Grip coefficient μ of this surface while the tyres hold (road 1.10, kerb 0.95, grass 0.45)."
      affects: "Max tyre force = μ × normal force: how fast the car can corner and brake on it (≈ μ·g). E2 sets road and kerb to 100: no grip limit."
      related: E2
    physics.surfaces.*.mu_kinetic:
      short: "Grip coefficient while sliding (lower than static)."
      affects: "Losing grip is punished: a sliding car brakes and corners worse until it recovers."
    physics.surfaces.*.rolling_res:
      short: "Rolling-resistance coefficient of this surface."
      affects: "Constant slowing force; grass (0.12) slows the car a lot, road (0.015) hardly."
    "*.extends":
      short: "The preset this one starts from; only the listed keys differ."
      affects: "Nothing by itself: the saved model stores the full merged values."

reward:
  title: What it is rewarded for
  intro: "The reward is the only thing that tells the agent what good driving is (PROJECT_CONTEXT §7.3). Each term is added every decision (20 per second)."
  keys:
    reward.type:
      short: "Which reward formula: progress (the default) or speed (a deliberately naive one for the reward-hacking demo, E3)."
      affects: "What the car tries to maximise. 'speed' pays for moving in any direction, which invites circling."
      range: "progress"
      related: E3
    reward.progress:
      short: "Points for each metre driven along the track (negative when driving backwards)."
      affects: "The main signal. The other numbers are weighed against it."
      range: "1.0"
    reward.time:
      short: "Points lost for every second that passes."
      affects: "Higher: pressure to be fast, so a faster lap scores more. Too high: the car rushes and crashes."
      range: "0.02–0.1"
    reward.steer_change:
      short: "Points lost for each sudden change of steering."
      affects: "Higher: smoother steering, which looks better and is usually faster. Too high: the car is reluctant to turn."
      range: "0.05–0.2"
    reward.offroad:
      short: "Points lost per second for each wheel off the road."
      affects: "Higher: the car stays on the tarmac. Lower: it may cut corners across the grass."
      range: "0.2–1.0"
    reward.lap_bonus:
      short: "A bonus for finishing a lap."
      affects: "Higher: more reason to complete laps cleanly."
      range: "5"
    reward.crash:
      short: "Points lost when a try ends early (barrier, too long off the road, stuck, wrong way)."
      affects: "Higher: a more cautious car. Lower: a braver car that crashes more while learning."
      range: "10–50"
    reward.speed:
      short: "(Speed reward only) Points per metre travelled in any direction."
      affects: "Pays for circling or weaving as much as for racing: the reward-hacking demo."
      related: E3

inputs:
  title: What it senses (inputs) and controls (outputs)
  intro: "The network sees only these numbers, never the map (PROJECT_CONTEXT §7.1). Each input is scaled to about [−1, 1]. Feature descriptions come from racer/env/features.py."
  keys:
    env.obs_spec.version:
      short: "Observation spec version: 1 = fixed layout (rays + extras, frozen); 2 = an ordered list of features."
      affects: "How the inputs are described. Old models keep their version forever."
    env.obs_spec.name:
      short: "Name of the input layout (e.g. rays5, rays9, rays7_narrow)."
      affects: "Nothing by itself: the list of rays and features is what counts."
    env.obs_spec.rays:
      short: "(v1) Ray list: angle (0 = straight ahead, + = left) and range (m) of each ray."
      affects: "What the car can see. Shallow angles see bends early; long forward rays let it brake in time (E4: a 60 m forward ray brakes late)."
      related: E4
    env.obs_spec.extras:
      short: "(v1) The non-ray inputs, in order."
      affects: "What the car knows about itself (heading, speeds, wheels on road, last action)."
    env.obs_spec.scales.v_long:
      short: "(v1) Forward speed is divided by this (m/s) and clipped to ±1."
      affects: "Input scaling only."
    env.obs_spec.scales.v_lat:
      short: "(v1) Sideways speed is divided by this (m/s) and clipped to ±1."
      affects: "Input scaling only."
    env.obs_spec.scales.yaw_rate:
      short: "(v1) Turning rate is divided by this (rad/s) and clipped to ±1."
      affects: "Input scaling only."
    env.obs_spec.features:
      short: "(v2) The ordered list of input features, each with its parameters."
      affects: "Adding or removing a feature changes what the car can sense and the number of inputs."
    env.action_spec.layout:
      short: "Output layout: what the network's outputs mean (steer_gas = 2 outputs; steer_throttle_brake = 3)."
      affects: "How the car is controlled. Old models without it mean steer_gas."
    env.raycast.hit_eps_m:
      short: "A ray starting within this distance (m) of a road edge reads 0."
      affects: "Ray precision. Technical; doesn't change what a ray means."
    env.raycast.min_step_m:
      short: "Smallest marching step (m) when tracing a ray."
      affects: "Speed versus precision of ray casting. Technical."
    env.raycast.min_step_growth:
      short: "The minimum step grows by this fraction of the distance already travelled."
      affects: "Cheaper long rays, slightly coarser far away. Technical."
    env.raycast.max_iters:
      short: "Maximum marching steps per ray; a ray that hits nothing returns its range."
      affects: "Technical."
    env.raycast.bisect_iters:
      short: "Refinement steps once a ray has crossed an edge."
      affects: "Hit precision (halved with each step). Technical."

episode:
  title: Episode rules
  intro: "How each training episode starts and ends (PROJECT_CONTEXT §7.4). Ending early costs the crash penalty; truncation doesn't."
  keys:
    env.episode.agent_hz:
      short: "Decisions per second; each action is held for physics_hz / agent_hz physics steps."
      affects: "Reaction time versus the number of decisions to learn."
      range: "20"
    env.episode.start_lateral_max_m:
      short: "Random sideways offset (m) of the starting position."
      affects: "Variety of starts, so the agent learns to recover."
    env.episode.start_heading_max_deg:
      short: "Random heading offset (degrees) at the start."
      affects: "Variety of starts."
    env.episode.start_speed_min:
      short: "Lowest random starting speed (m/s)."
      affects: "Variety of starts."
    env.episode.start_speed_max:
      short: "Highest random starting speed (m/s)."
      affects: "Starting at speed teaches braking from the first second."
    env.episode.offroad_limit_s:
      short: "All 4 wheels off the road this long (s) ends the episode with the crash penalty."
      affects: "Stricter = learns to stay on the road, but fewer chances to recover."
      range: "0.5–2"
    env.episode.noprogress_window_s:
      short: "Time window (s) for the no-progress check."
      affects: "Ends episodes where the car stops or crawls."
    env.episode.noprogress_min_m:
      short: "Minimum progress (m) required within the window."
      affects: "Ends episodes where the car stops or crawls."
    env.episode.wrongway_deg:
      short: "Heading error (degrees) that counts as driving the wrong way."
      affects: "Ends episodes going backwards."
    env.episode.wrongway_limit_s:
      short: "Time (s) the car may point the wrong way before the episode ends."
      affects: "Ends episodes going backwards."
    env.episode.max_laps:
      short: "Episode is truncated (no penalty) after this many laps."
      affects: "Longer episodes = more full laps per update."
    env.episode.max_steps:
      short: "Episode is truncated after this many decisions (4000 = 200 s)."
      affects: "Caps very slow episodes."
    env.episode.track_limits:
      short: "If true, the episode ends (with the crash penalty) as soon as the car's centre crosses the road edge. Kerbs count as road. Missing = false (all models before D26)."
      affects: "No grass shortcuts and no driving with half the car off the road: the car must stay on track. Used by neuroevolution (rays7_lean, D26)."

training:
  title: How it trained (hyperparameters)
  intro: "Settings of the learning algorithm and the network (PROJECT_CONTEXT §8). Algorithm descriptions (PPO, SAC, GA) come from racer/agents/algorithms.py."
  keys:
    train.algorithm:
      short: "Learning algorithm (ppo, sac or ga = neuroevolution)."
      affects: "How the policy is improved from experience (E7)."
      related: E7
    train.seed:
      short: "Random seed of the run."
      affects: "Starting weights and random starts. Two seeds of the same setting show how much results vary by luck."
    train.total_steps:
      short: "Environment steps of training, all envs together (decisions)."
      affects: "Training time: ≈ 10 min per million steps alone, ≈ 13 min with 2 runs in parallel. The best checkpoint may come earlier. GA: an optional budget; empty = run until validation stops improving or the run is paused."
      range: "1M–5M"
    train.n_envs:
      short: "Environments simulated in parallel processes."
      affects: "Throughput, and the amount of data per update (n_steps × n_envs)."
      range: "6"
    train.torch_threads:
      short: "torch threads per process."
      affects: "1 is fastest for a network this small (T62)."
    train.checkpoint_every:
      short: "Steps between saved checkpoints; each one is evaluated."
      affects: "How finely you can pick the best moment of a run."
    train.ppo.n_steps:
      short: "How many steps each practice car drives before the network studies what happened (one batch of experience)."
      affects: "Higher: every lesson rests on more driving, so learning is steadier but updates come less often. Lower: quicker but noisier lessons."
      range: "1024 (512–2048)"
    train.ppo.batch_size:
      short: "How many driving moments the network studies at once in a learning round."
      affects: "Smaller: noisier, more rounds. Larger: smoother, slower. It should divide n_steps × 6 evenly (a warning appears if not)."
      range: "256 (64–512)"
    train.ppo.n_epochs:
      short: "How many times the network re-studies the same batch of driving."
      affects: "More: squeezes more out of each batch but can overshoot and get worse. Fewer: safer but slower."
      range: "10 (5–20)"
    train.ppo.gamma:
      short: "How much the car cares about the future. 0.995 means it looks about 10 seconds ahead."
      affects: "Higher: plans further, so it brakes earlier for corners, but learning is slower and noisier. Lower: short-sighted, and crashes in corners it should have braked for."
      range: "0.995 (0.99–0.999)"
    train.ppo.gae_lambda:
      short: "How the car judges whether an action was good: near 1 trusts the whole outcome, lower trusts a short-term guess."
      affects: "Higher: fewer wrong lessons but a noisier signal. Lower: smoother but can mislearn."
      range: "0.95 (0.9–0.98)"
    train.ppo.learning_rate:
      short: "How big a step the network takes each time it learns. The most important dial."
      affects: "Higher: learns faster but can suddenly collapse into bad driving. Lower: slow and steady. Fine-tuning a good model uses a lower rate."
      range: "0.0003 (0.0001–0.001)"
    train.ppo.lr_schedule:
      short: "Whether the learning rate shrinks over the run (linear) or stays the same (constant)."
      affects: "linear: big steps early, tiny steps at the end, so the driving settles. constant: keeps changing until the end."
      range: "linear"
    train.ppo.clip_range:
      short: "A safety fence: how far one learning round may change the car's behaviour."
      affects: "Smaller: very cautious, slow. Larger: bolder and riskier."
      range: "0.2 (0.1–0.3)"
    train.ppo.ent_coef:
      short: "A bonus for trying different things (entropy means randomness)."
      affects: "Higher: keeps exploring, which avoids getting stuck early, but the driving looks sloppy. Near zero: commits quickly to what it already knows."
      range: "0.002 (0–0.01)"
    train.ppo.vf_coef:
      short: "How much effort goes into the critic, the part of the network that predicts how well a situation will go."
      affects: "Higher: the critic learns faster but may slow down the driver. Rarely worth changing."
      range: "0.5"
    train.ppo.max_grad_norm:
      short: "A speed limit on how much one learning round may change the weights."
      affects: "Lower: calmer learning. Rarely worth changing."
      range: "0.5"
    train.sac.learning_rate:
      short: "How big a step the network takes each time it learns (the same idea as in PPO)."
      affects: "Higher: faster but less stable. Lower: slower and steadier."
      range: "0.0003 (0.0001–0.001)"
    train.sac.lr_schedule:
      short: "Whether the learning rate shrinks over the run (linear) or stays the same (constant)."
      affects: "constant is the SAC default; linear settles the driving at the end."
      range: "constant"
    train.sac.buffer_size:
      short: "The memory of past driving that SAC studies again and again (PPO throws its experience away after each lesson)."
      affects: "Larger: more variety to learn from, more memory used. Smaller: forgets old driving sooner."
      range: "1,000,000"
    train.sac.learning_starts:
      short: "Steps of random driving at the start, to fill the memory before any learning happens."
      affects: "Higher: better first lessons but a slower start. Lower: starts learning from very little."
      range: "10,000"
    train.sac.batch_size:
      short: "How many driving moments the network studies at once in a learning round."
      affects: "Smaller: noisier. Larger: smoother but slower per round."
      range: "256"
    train.sac.tau:
      short: "How slowly the steady 'target' copy of the network follows the real one. The copy keeps learning from wobbling."
      affects: "Smaller: more stable but slower to learn. Larger: faster but wobblier."
      range: "0.005"
    train.sac.gamma:
      short: "How much the car cares about the future (0.995 is about 10 seconds ahead)."
      affects: "Higher: plans further ahead. Lower: short-sighted."
      range: "0.995"
    train.sac.train_freq:
      short: "How many steps pass between learning rounds. 1 means the network learns after every step."
      affects: "Higher: less learning per step but faster training. Lower: more learning per step, slower."
      range: "1"
    train.sac.gradient_steps:
      short: "How many learning updates happen in each round."
      affects: "More: learns more from the same driving but each step takes longer."
      range: "1 (1–2)"
    train.sac.ent_coef:
      short: "How much SAC is rewarded for trying new things. 'auto' lets it tune this itself."
      affects: "Higher: explores more. 'auto' is a good choice for almost everyone."
      range: "auto"
    train.ga.population:
      short: "How many cars drive in each generation; all of them drive the same map from the same start."
      affects: "More: a wider search each generation but every generation takes longer. Fewer: faster generations, less variety."
      range: "50 (50–100)"
    train.ga.elite_frac:
      short: "The share of the best cars that go into the next generation unchanged. They are also the only parents."
      affects: "Higher: safer, good cars are kept. Lower: more new variations each generation, riskier."
      range: "0.25"
    train.ga.sigma:
      short: "Mutation size: how strongly each child is randomly changed from its parent (noise added to every weight)."
      affects: "Too small: no progress. Too large: the child forgets what its parent could do. 0.02 beat 0.05 in our test (T96)."
      range: "0.02 (0.01–0.05)"
    train.ga.start:
      short: "Where each try begins: 'line' = on the start line standing still; 'random' = anywhere on the track at any speed."
      affects: "line: every try is a full lap from a standing start, like the evaluation. random: the cars learn to recover from any position (older runs)."
      range: "line"
    train.ga.speed_scale:
      short: "(Fitness 1) A scale (m/s) for the score of cars that finish a lap: score = 1 + average speed ÷ this."
      affects: "Only the size of the score. Any car that finishes beats any car that crashed, and a faster lap beats a slower one."
      range: "70"
    train.ga.fitness:
      short: "Which score ranks the cars: 1 = lap fraction if it failed, 1 + average speed ÷ speed_scale if it finished (older runs); 2 = a lap-time score (see ref_speed); 3 = both: 1 until the cars complete laps consistently, then 2."
      affects: "2 rewards speed more and more, and lets a fast crash late in the lap beat a slow finish. Selection only uses the order of the scores, so the shape matters, not the size."
      range: "2 (new runs), 1 (older runs)"
    train.ga.ref_speed:
      short: "(Fitness 2) The 'baseline pace' in m/s that lap speeds are compared with. Not the top speed."
      affects: "Only shifts where the score curve starts to climb steeply; 25 is the hand-coded driver's average speed."
      range: "25"
    train.ga.fail_speed_frac:
      short: "(Fitness 2) A car that crashes is charged the rest of the lap at this share of ref_speed, as if it had to crawl round."
      affects: "Lower: crashing is punished more, cars stay careful. Higher: a fast crash costs little, cars take more risk."
      range: "0.3"
    train.ga.speed_k:
      short: "(Fitness 2) How curved the speed bonus is: the score grows like e^(k × speed ÷ ref_speed)."
      affects: "Higher: the last bit of speed is worth much more than the first. Lower: closer to a straight line."
      range: "2"
    train.ga.finish_bonus:
      short: "(Fitness 2) A fixed amount added to every car that finishes the lap."
      affects: "Higher: finishing matters more than a fast but crashed lap. Lower: speed counts more."
      range: "0.5"
    train.ga.sigma_floor:
      short: "If set, the mutation size shrinks as generations pass (slowly, like a log curve) until it reaches this value. Empty = constant."
      affects: "Late in a run smaller changes fine-tune the cars instead of breaking them. Too small: the search stops exploring."
      range: "0.005 (empty = no shrinking)"
    train.ga.sigma_g0:
      short: "(With sigma_floor) How many generations the mutation size takes to start shrinking: σ = sigma ÷ (1 + ln(1 + generation ÷ this))."
      affects: "Higher: shrinks later and slower."
      range: "100"
    train.ga.validation.smooth:
      short: "The 'no progress' test uses the average of the last this-many validations, not just the newest one."
      affects: "Higher: one lucky or unlucky validation can't reset or stop the run. 1 = the newest value alone (older runs)."
      range: "3 (1 for older runs)"
    train.ga.stage_window:
      short: "(Fitness 3) How many recent generations are checked when deciding whether the cars complete laps consistently."
      affects: "Longer: the switch to the speed score comes later and more safely."
      range: "100"
    train.ga.stage_min_finishers:
      short: "(Fitness 3) A generation counts as 'completing laps' when at least this many of its cars finish the lap."
      affects: "Higher: the cars must be more reliable before the speed score starts."
      range: "5"
    train.ga.stage_share:
      short: "(Fitness 3) The share of the last stage_window generations that must count as 'completing laps' before the speed score starts."
      affects: "Lower: switches earlier, also when hard maps still have no finishers."
      range: "0.9"
    train.ga.normalise:
      short: "Standardise the inputs before the network sees them, as PPO does (D33). The statistics are measured once at the start from the hand-coded driver on the training maps, then frozen."
      affects: "Inputs of very different size (a near edge at 7 m of 200, a speed) all arrive as numbers of similar size, so no input drowns the others. Frozen, because moving statistics would change every car under the population and break rebuilding cars from the lineage."
      range: "false (off) / true"
    train.ga.norm_min_std:
      short: "(With normalise) The smallest spread an input may be given when standardising."
      affects: "Without it an input that hardly moves for the driver (e.g. 'no second crossing') would turn into a huge number the moment a car makes it move."
      range: "0.05"
    train.ga.norm_clip:
      short: "(With normalise) After standardising, inputs are cut off at plus or minus this."
      affects: "Same role as PPO's clip_obs. Lower: extreme inputs count for less."
      range: "10.0"
    train.ga.obs_norm:
      short: "The measured mean and variance of every input (written by the run itself when it starts; not a setting)."
      affects: "The numbers every car of this run, and every model exported from it, standardises its inputs with."
    train.ga.obs_norm.mean:
      short: "The average of each input over the baseline's driving (measured once at the start of the run)."
      affects: "Subtracted from every input before the network sees it."
    train.ga.obs_norm.var:
      short: "The variance of each input over the baseline's driving, with the floor norm_min_std applied."
      affects: "Every input is divided by its square root: inputs that vary a lot are scaled down, quiet ones up."
    train.ga.obs_norm.clip:
      short: "The cut-off applied after standardising (copied from norm_clip)."
      affects: "Keeps one extreme input from dominating the network."
    train.ga.obs_norm.count:
      short: "How many observations the statistics were measured from."
      affects: "Only for the record: more observations, steadier statistics."
    train.ga.workers:
      short: "How many processor cores drive cars at the same time."
      affects: "More: faster generations but a busier PC. Fewer: calmer PC. Results are identical for any number."
      range: "5 (about 60 % CPU)"
    train.ga.checkpoint_every:
      short: "(Runs before 2026-10-15) Generations between saved checkpoints. Newer runs save one at every validation."
      affects: "How finely you can pick the best moment of a run."
    train.ga.max_generations:
      short: "Stop after this many generations. Empty means: run until the validation score stops improving."
      affects: "Run length. A limit stops it earlier; no limit lets it run until it plateaus (you can pause any time)."
      range: "200 for a quick test, 1000–2000 for a real run"
    train.ga.evaluate.top_validated:
      short: "After the run, test this many saved cars that scored best on the validation tracks."
      affects: "Finds the best car even when it appeared early: later cars are not reliably better."
      range: "10"
    train.ga.evaluate.last:
      short: "After the run, also test this many of the most recent saved cars."
      affects: "Shows where the run ended up. The others can be tested later with evaluate.py."
      range: "10"
    train.ga.state_every:
      short: "How many generations pass between safety saves of the run (a pause always saves)."
      affects: "Only how much work is lost if the PC crashes."
      range: "10"
    train.ga.validation.every:
      short: "How many generations pass between check-ups, when the best cars drive tracks they never trained on."
      affects: "Smaller: notices a plateau sooner and saves more checkpoints (more Evolution Race steps). Larger: less checking."
      range: "20"
    train.ga.validation.tracks:
      short: "How many fresh generated tracks the check-up uses (never trained on, not the test or held-out maps)."
      affects: "More: a steadier signal for when to stop, but slower check-ups."
      range: "5"
    train.ga.validation.stream:
      short: "Which random-track stream the check-up tracks come from (0 = training pool, 1 = held-out set, 2 = its own)."
      affects: "Keeps the check-up tracks separate from every other set. Leave it."
      range: "2"
    train.ga.validation.patience:
      short: "How many generations the run waits for an improvement before it stops."
      affects: "Longer: more chance of a late improvement but longer runs. A finished run can be continued later with a larger value (Explorer → Evolution → Continue this run)."
      range: "500"
    train.ga.validation.min_gain:
      short: "How much better (as a share, 0.01 = 1 %) a check-up score must be to count as an improvement."
      affects: "Larger: stops runs that only creep forward. Smaller: keeps going on tiny gains."
      range: "0.01"
    train.policy.net_arch:
      short: "How many neurons are in each hidden layer. The network is a stack of these: the senses go in, steering and pedals come out."
      affects: "Bigger: can learn subtler driving but trains slower and needs more data. Smaller: faster, but may be too simple."
      range: "[256, 256]; try [64, 64] for a quick test"
    train.policy.activation:
      short: "The function each neuron applies. tanh gives smooth values between −1 and 1; relu is simpler and often learns faster at first."
      affects: "tanh: smoother steering and pedals (the PPO default). relu: faster early learning, jerkier outputs (the SAC default)."
      range: "tanh"
    train.vecnormalize.norm_obs:
      short: "Normalise inputs by their running mean and spread (statistics saved with the model)."
      affects: "Makes all inputs equally visible to the network."
    train.vecnormalize.norm_reward:
      short: "Scale rewards by the running spread of the return."
      affects: "Keeps the learning signal in a stable range."
    train.vecnormalize.clip_obs:
      short: "Normalised inputs are clipped to ± this."
      affects: "Guards against outliers."
    train.vecnormalize.gamma:
      short: "Discount used for reward normalisation."
      affects: "Should match the algorithm's gamma."

baseline:
  title: Baseline driver (hand-coded, E8)
  intro: "The PID baseline is not trained. It sees the centreline (map knowledge the RL car doesn't have) and drives at a planned safe speed. Lap ratio compares every model's laps with its laps."
  keys:
    train.lookahead_min_m:
      short: "Pure-pursuit steering target distance at low speed (m)."
      affects: "Shorter = tighter line but twitchier."
    train.lookahead_time_s:
      short: "Seconds of travel added to the steering target distance."
      affects: "Smoother steering at speed."
    train.lat_acc_target:
      short: "Planned cornering acceleration (m/s²); corner speed = √(a / |curvature|)."
      affects: "Higher = faster corners, closer to the grip limit (μg ≈ 10.8)."
    train.brake_decel:
      short: "Planned braking deceleration (m/s²) into slower sections."
      affects: "Braking distance it plans for."
    train.plan_horizon_m:
      short: "How far ahead (m) it looks for slow sections."
      affects: "Early enough braking for long straights."
    train.v_max:
      short: "Speed cap (m/s)."
      affects: "Top speed on straights."
    train.speed_gain:
      short: "Pedal = gain × (target speed − speed)."
      affects: "How aggressively it tracks its speed plan."

tracks:
  title: Where it trained (track sets)
  intro: "Which tracks each training episode samples (PROJECT_CONTEXT §6, §8). Test maps and held-out tracks are never trained on, so they measure generalisation."
  keys:
    tracks:
      short: "(old snapshots) The list of track names trained on."
      affects: "What the car practised on."
    tracks.trackset:
      short: "Name of the track set."
      affects: "What the car practised on."
    tracks.fixed:
      short: "Named maps and their sampling weights."
      affects: "How often each hand-designed map comes up."
    tracks.generated:
      short: "Generated-track pool settings (empty = no generated tracks)."
      affects: "Variety: random tracks fight overfitting to the named maps (E5)."
      related: E5
    tracks.generated.weight:
      short: "Total sampling weight of generated tracks, against the fixed maps."
      affects: "Share of episodes on random tracks."
    tracks.generated.seeds:
      short: "Range of generator seeds (training stream 0, never the held-out stream)."
      affects: "How many different random tracks can appear."
    tracks.generated.pool_size:
      short: "Generated tracks each env keeps loaded."
      affects: "Memory and variety; building a track takes ~65 ms."
    tracks.generated.refresh_episodes:
      short: "Episodes between swapping one pooled track for a new one."
      affects: "How quickly new random tracks come in."
    tracks.generated.track_overrides.generator.width_m:
      short: "Road width range (m) of generated tracks."
      affects: "Narrow roads are harder and teach precise lines."
    tracks.generated.track_overrides.generator.radius_jitter:
      short: "Radius jitter of generated tracks."
      affects: "Deeper in/out wiggles = tighter corners."
    tracks.generated.track_overrides.generator.angle_jitter:
      short: "Angle jitter of generated tracks."
      affects: "Less regular corner spacing."
    presets.physics:
      short: "Physics preset the run started from."
      affects: "See the car section for its values."
    presets.env:
      short: "Input / episode preset the run started from."
      affects: "See the inputs section for its values."
    presets.reward:
      short: "Reward preset the run started from."
      affects: "See the reward section for its values."
    presets.track:
      short: "Track-geometry preset."
      affects: "Spline, kerb, field and generator settings."
    presets.trackset:
      short: "Track-set preset the run trained on."
      affects: "See the track set for its maps."

track_geometry:
  title: Track geometry (shared settings)
  intro: "How tracks are built from their control points (PROJECT_CONTEXT §6). The same for every model so far; listed for completeness."
  keys:
    track.spline.alpha:
      short: "Catmull-Rom parameterisation (0.5 = centripetal: no cusps or loops)."
      affects: "Shape of the centreline between control points."
    track.spline.dense_per_segment:
      short: "Samples per control-point segment before resampling."
      affects: "Precision of the centreline. Technical."
    track.spline.resample_m:
      short: "Spacing (m) of the resampled centreline."
      affects: "Precision of progress and curvature. Technical."
    track.spline.curvature_smooth_m:
      short: "Window (m) for the smoothed curvature."
      affects: "Kerb placement and the curvature_ahead feature."
    track.kerb.curvature_min:
      short: "Kerbs appear where |curvature| exceeds this (1/m; 0.02 = radius < 50 m)."
      affects: "Where the slightly less grippy kerbs are."
    track.kerb.extend_m:
      short: "Kerbs start and end this far (m) before and after the curve."
      affects: "Kerb length."
    track.kerb.min_length_m:
      short: "Shorter kerb runs are dropped (m)."
      affects: "Kerb clutter."
    track.field.cell_m:
      short: "Grid cell size (m) of the track field (distance to the centreline)."
      affects: "Precision of surfaces, rays and the barrier. Technical."
    track.field.margin_m:
      short: "The grid extends this far (m) beyond the barrier."
      affects: "Technical."
    track.field.territory_jump_m:
      short: "A jump this far (m, along the track) to another section counts as hitting the barrier."
      affects: "Puts walls between close sections, so the car can't cut across the grass."
    track.validation.min_corner_radius_m:
      short: "Tightest corner (m) a valid track may have."
      affects: "Which tracks are accepted."
    track.validation.min_length_m:
      short: "Shortest valid track (m)."
      affects: "Which tracks are accepted."
    track.validation.max_length_m:
      short: "Longest valid track (m)."
      affects: "Which tracks are accepted."
    track.validation.clearance_m:
      short: "Minimum grass gap (m) between roads of different sections."
      affects: "Which tracks are accepted."
    track.validation.adjacency_arc_m:
      short: "Samples closer than this (m) along the track count as the same section."
      affects: "Technical."
    track.generator.n_points:
      short: "Control points of a generated track (range)."
      affects: "More = more corners."
    track.generator.radius_m:
      short: "Base radius (m) of the circle generated tracks are built around."
      affects: "Track size and length."
    track.generator.radius_jitter:
      short: "Each point's radius = base × a random factor from this range."
      affects: "How wiggly generated tracks are."
    track.generator.angle_jitter:
      short: "Random shift of each point's angle (fraction of the spacing)."
      affects: "Irregular corner spacing."
    track.generator.width_m:
      short: "Road width (m) of generated tracks."
      affects: "Difficulty."
    track.generator.runoff_m:
      short: "Grass run-off (m) between the road edge and the barrier."
      affects: "Room to recover before hitting the barrier."
    track.generator.kerb_m:
      short: "Kerb band width (m)."
      affects: "Kerb size."
    track.generator.max_attempts:
      short: "Tries before the generator gives up on a seed."
      affects: "Technical."
    track.heldout.count:
      short: "Number of generated held-out tracks."
      affects: "Size of the generalisation test."
    track.heldout.stream:
      short: "Seed stream of the held-out tracks (training uses stream 0)."
      affects: "Keeps held-out tracks out of training."

shape:
  title: Model shape (manifest)
  intro: "A summary of the model the engine derives from its snapshot (D23): sizes, labels and versions."
  keys:
    manifest.obs_spec:
      short: "Name of the input layout."
      affects: "—"
    manifest.obs_spec_version:
      short: "Observation spec version (1 or 2)."
      affects: "—"
    manifest.obs_dim:
      short: "Number of inputs."
      affects: "Size of the network's first layer."
    manifest.obs_labels:
      short: "Name of every input, in order."
      affects: "—"
    manifest.inputs:
      short: "The input features with their sizes and parameters."
      affects: "—"
    manifest.action_layout:
      short: "Output layout."
      affects: "—"
    manifest.action_dim:
      short: "Number of outputs."
      affects: "—"
    manifest.action_labels:
      short: "Name of every output."
      affects: "—"
    manifest.physics_version:
      short: "Physics equations version (1 = the §5 model)."
      affects: "Which car code runs the model."
    manifest.algorithm:
      short: "Learning algorithm."
      affects: "—"
    manifest.net_arch:
      short: "Hidden layer widths."
      affects: "—"
    manifest.activation:
      short: "Activation function."
      affects: "—"
    manifest.n_params:
      short: "Parameters of the driving network (the actor)."
      affects: "What runs in the game."
    manifest.n_params_total:
      short: "All trained parameters, including the critic used only during training."
      affects: "—"

run:
  title: The run (identity)
  intro: "Who, when and how: ids, dates, notes and the exact command."
  keys:
    run.run_id:
      short: "Run id (R = real run, S = trial run)."
      affects: "—"
    run.tag:
      short: "Short name of the experiment; the seed suffix (_s1) groups repeats."
      affects: "—"
    run.algorithm:
      short: "Learning algorithm."
      affects: "—"
    run.seed:
      short: "Random seed."
      affects: "—"
    run.created_at:
      short: "When the run started."
      affects: "—"
    run.git_commit:
      short: "Code version the run used (real runs need a clean tree, D12)."
      affects: "—"
    run.obs_spec_version:
      short: "Observation spec version."
      affects: "—"
    run.notes:
      short: "Why the run was made, written when it started."
      affects: "—"
    run.parent_model:
      short: "Model it was fine-tuned from (empty = trained from scratch)."
      affects: "A fine-tune starts from the parent's driving and normaliser."
    run.curriculum:
      short: "Short description of the run's place in the experiments."
      affects: "—"
    run.command:
      short: "The exact training command."
      affects: "—"
    run.model_id:
      short: "This checkpoint's id: run, tag and steps."
      affects: "—"
    run.steps:
      short: "Training steps at this checkpoint."
      affects: "—"
    run.saved_at:
      short: "When this checkpoint was saved."
      affects: "—"
    run.generation:
      short: "(GA) Generation this car comes from (which car: run.car)."
      affects: "—"
    run.extensions:
      short: "(GA) When a finished run was continued (D29): the time, the new patience and the generation budget of each extension."
      affects: "—"
    run.car:
      short: "(GA) Index of this car in its generation (from generation 1, the first n_elite are the elites carried over, best first)."
      affects: "—"
    run.validation:
      short: "(GA) This car's mean fitness on the validation tracks (generated, never trained on); empty if its generation wasn't validated."
      affects: "—"
    run.exported_at:
      short: "(GA) When this car was rebuilt from the lineage and saved (scripts/export_ga.py or the Explorer's Evolution tab)."
      affects: "—"
    run.fitness:
      short: "(GA) The car's fitness in its generation. Fitness 1: lap fraction (0–1) if it failed, 1 + mean speed / speed_scale if it finished. Fitness 2: a convex lap-time score, see train.ga.fitness."
      affects: "—"
    run.versions.*:
      short: "Library version used for training."
      affects: "—"

results:
  title: Results (evaluation metrics)
  intro: "Deterministic driving with fixed starts (PROJECT_CONTEXT §8). Protocol v2: 7 training maps × 2 starts, 2 test maps × 3, 10 generated held-out tracks × 1. Compare models only within one protocol."
  keys:
    metric.completion_rate:
      short: "Share of episodes that completed laps without crashing on the seen maps (v1: showcase tracks; v2: the 7 training maps)."
      affects: "Reliability on tracks it trained on."
    metric.test_completion:
      short: "(v2) Completion on the 2 hand-designed test maps, never trained on."
      affects: "Generalisation to new hand-made tracks."
    metric.heldout_completion:
      short: "Completion on the 10 generated held-out tracks, never trained on."
      affects: "Generalisation to random tracks."
    metric.unseen_completion:
      short: "(v2) Completion on all unseen tracks: test maps + held-out tracks."
      affects: "The number that matters for a faculty-drawn track."
    metric.overall_completion:
      short: "Completion over every evaluation episode."
      affects: "Used to pick the best checkpoint (D9)."
    metric.crash_rate:
      short: "Share of episodes ended by a crash, off-road, stuck, wrong way or track limits."
      affects: "—"
    metric.mean_speed:
      short: "Mean speed over all episodes (m/s)."
      affects: "—"
    metric.offroad_pct:
      short: "Mean share of wheels off the road over all decisions (%; 25 = one wheel off all the time)."
      affects: "Corner cutting and sloppy lines."
    metric.mean_lat_g:
      short: "Mean sideways acceleration (g)."
      affects: "How hard it uses the grip in corners."
    metric.lap_ratio:
      short: "Best lap ÷ the baseline's best lap, averaged over the maps it lapped."
      affects: "Below 1.0 = faster than the hand-coded driver."
    metric.score:
      short: "Ranking score (= overall completion)."
      affects: "—"
    metric.best_lap_*:
      short: "Best lap time (s) on that map."
      affects: "—"
    metric.mean_lap_*:
      short: "Mean lap time (s) on that map."
      affects: "—"

build:
  title: "Build & Queue: what each setting means"
  intro: "Plain-language help for the Build & Queue page (D30): what a setting is, what happens when you turn it, and a safe starting value."
  keys:
    build.start_model:
      short: "Copies everything about an existing trained model (inputs, network, learning, car, tracks) into the form."
      affects: "A quick way to make a variation: change one thing and compare against the original."
      range: "R015 is the best PPO model"
    build.start_env:
      short: "A ready-made set of inputs and episode rules (from configs/env) to start the form from."
      affects: "Sets the rays and readings; the rest of the form gets the standard defaults for the algorithm you pick."
      range: "rays7_narrow for PPO, rays7_lean for GA"
    build.algorithm:
      short: "The method that improves the car. PPO and SAC learn from rewards by trial and error; GA (neuroevolution) breeds the best cars and mutates them."
      affects: "PPO: reliable, our best results. SAC: reuses old driving, a comparison. GA: no gradients, needs many more steps (E10)."
      range: "PPO"
    build.use_rays:
      short: "Rays are the car's eyes: straight lines that measure how far away the road edge is."
      affects: "Without rays the car cannot see the road ahead and will not learn to drive."
      range: "On"
    build.ray_angle:
      short: "Direction of the ray in degrees. 0 is straight ahead, positive is to the left, negative to the right."
      affects: "Narrow angles near 0 see bends early. Wide angles (±60° to ±90°) see the road edges beside the car."
      range: "0, ±7, ±20, ±60"
    build.ray_range:
      short: "How far the ray can see, in metres."
      affects: "Longer: sees bends earlier (needed to brake from high speed: ~200 m straight ahead). Shorter: cheaper but late braking."
      range: "200 ahead, 60 to the sides"
    build.scale:
      short: "The number this reading is divided by so it fits roughly between −1 and 1."
      affects: "Rarely worth changing. Too small: the reading saturates. Too large: it barely registers."
      range: "Leave the default"
    build.layout:
      short: "What the network controls. steer_gas: one value for steering and one pedal (negative = brake). steer_throttle_brake: steering plus two separate pedals."
      affects: "Separate pedals allow throttle and brake together, but need a bit more to learn. All current models use steer_gas."
      range: "steer_gas"
    build.layers:
      short: "How many hidden layers the network has. Each layer lets it combine the senses in another step."
      affects: "More layers: can learn more complex rules but trains slower. Two is plenty for driving."
      range: "2"
    build.width:
      short: "How many neurons this layer has."
      affects: "More neurons: more capacity, slower training. Fewer: faster but simpler."
      range: "256"
    build.physics:
      short: "The car and the ground it drives on (mass, engine, grip)."
      affects: "Changes how the car behaves, so models trained on different cars cannot be compared fairly. no_grip_limit is a demonstration, downforce a variation."
      range: "default"
    build.reward:
      short: "What the car is rewarded for (PPO and SAC only; evolution scores laps instead)."
      affects: "progress rewards driving forward along the track. speed_naive rewards speed in any direction and shows reward hacking."
      range: "progress"
    build.trackset:
      short: "Which tracks the car practises on and how often each is picked."
      affects: "More varied tracks: a car that copes with new tracks. A single track: an expert on that track only (it overfits). Test maps are never used."
      range: "maps7 (PPO), train7 (GA)"
    build.steps:
      short: "How many steps of driving the training lasts (20 steps = 1 second of driving)."
      affects: "More steps: better driving up to a point, longer wait (about 10 minutes per million). A checkpoint is saved and tested every 100,000 steps, so you can pick the best moment later."
      range: "2M to try, 5M for a serious run"
    build.generations:
      short: "How many generations the evolution runs."
      affects: "More: further progress, longer wait. 'No limit' runs until the validation score stops improving; pause or extend it any time."
      range: "500 to try, 2000 for a serious run"
    build.seeds:
      short: "Random starting points. One run is made per seed, e.g. '1, 2' makes two runs."
      affects: "Two seeds show whether a result was skill or luck: the same setup can turn out well or badly (R015 vs R018)."
      range: "1, or 1, 2 for a fair comparison"
    build.trial:
      short: "A trial is a throwaway test run kept out of the main registry and results."
      affects: "Use it for quick checks. Untick it when the result should count and be compared."
      range: "On for quick tests, off for real runs"
    build.tag:
      short: "A short name for this run, used in its folder and model id (letters, digits and _ only). It is suggested from your choices."
      affects: "Helps you find the model later. The seed is added automatically (…_s1)."
      range: "e.g. ppo_r9_256x256_5m"
    build.why:
      short: "A sentence on what this run is meant to show. It is stored with the model."
      affects: "Future you will read this on the Explorer page. A good one says what you changed and what you expect."
      range: "e.g. Does a 512 network drive better than 256?"
    build.metric_io:
      short: "How many numbers go into the network (inputs) and come out (outputs)."
      affects: "More inputs means a bigger first layer. Outputs are steering and pedals."
    build.metric_weights:
      short: "How many adjustable numbers (weights) the network has that drive the car."
      affects: "A rough measure of its capacity. R015 has about 74,000."
    build.parallel:
      short: "How many runs train at the same time."
      affects: "2 is fastest on this PC (1.6× the total speed of one). 3 slows everything down."
      range: "2"

quickpicks:
  title: "Quick-pick presets"
  intro: "The files behind the quick-pick buttons on Build & Queue (configs/rays, readings, network, learning, budget). Network and learning picks use the notes of the train.* settings they fill in."
  keys:
    rays.rays:
      short: "A list of rays, each with an angle (degrees, 0 = ahead, + = left) and a range (metres)."
      affects: "Decides where the car looks. Shallow rays see bends early; wide rays see the road beside the car."
    readings.features:
      short: "The car's own readings that go into the network besides the rays, each with its scale."
      affects: "More readings give the network more to work with but also more to learn."
    budget.steps:
      short: "Training steps for PPO and SAC."
      affects: "More steps: longer training, usually better driving up to a point."
      range: "300,000 – 5,000,000"
    budget.generations:
      short: "Generations for neuroevolution; empty means no limit."
      affects: "More generations: further progress, longer wait."
      range: "50 – 2000"
    budget.seeds:
      short: "The random seeds to train, one run each."
      affects: "Several seeds show how much a result depends on luck."
      range: "[1] or [1, 2]"
    budget.trial:
      short: "Whether the runs are throwaway trials, kept out of the main results."
      affects: "true for quick checks, false for real runs."
    memory.steps:
      short: "How many earlier decisions the car remembers as extra inputs (20 decisions = 1 second). 0 switches the memory off."
      affects: "More: the car can feel trends (speeding up, a bend getting closer) but the network gets many more inputs to learn from. At the start of a lap the 'past' is simply the present."
      range: "0 to start; 3–10 to try"
    memory.stride:
      short: "Remember every n-th decision instead of every one: 2 means 1, 2, 3… steps back become 2, 4, 6… steps back."
      affects: "Higher: a longer memory for the same number of inputs, but with gaps."
      range: "1"
    memory.of:
      short: "Which inputs get a memory. Rays are left out unless you tick them (they multiply the inputs fast)."
      affects: "Remembering only speeds and heading is cheap and usually enough; remembering rays shows how fast the road edge is approaching."
      range: "The car's own readings"
