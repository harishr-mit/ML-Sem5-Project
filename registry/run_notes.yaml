# Why each run was made and what it showed (AI Sandbox, T67; owner decision T65).
# Model snapshots can never change, so explanations written after a run live here, keyed by
# run id. Edited by hand or in the sandbox's Model Explorer. Fields: why, outcome.
R001:
  why: 'M1, the first real run: can PPO learn to lap one wide track (Training Ground) with 5 rays and the grip
    physics?'
  outcome: 'Yes: @1200k it laps all 6 starts in 42.70 s against the baseline''s 46.6 s. Fast on its own track only
    (v2: seen 29 %, unseen 19 %, lap ratio 0.94).'
R002:
  why: 'D8 curriculum stage 2: fine-tune R001@1200k on generated wide tracks, so it learns to drive any track.'
  outcome: 'Negative result: it did not generalise (10 % held-out on v1; v2: seen 21 %, unseen 6 %, lap ratio
    1.11); the car kept leaving the road. Stage 3 was dropped, and every later run trains from scratch on mixed
    tracks.'
R003:
  why: 'Train from scratch on final_mix (showcase tracks + generated tracks) instead of continuing the curriculum
    chain.'
  outcome: 'Reliable on v1 within ~1M steps (100 % showcase, 80 % held-out) but slow: lap ratio 1.19. v2: seen 57 %,
    unseen 50 %.'
R004:
  why: 'E1 reference, seed 1: rays5 on final_mix from scratch, 3M steps. The overnight ablations are compared with
    it.'
  outcome: 'v2: seen 43 %, unseen 50 %, lap ratio 1.16. Seed 2 (R010) is similar: the setting is reliable but slow.'
R005:
  why: 'E2, seed 1: grip limit off (road and kerb μ = 100). Does the physics create the racing line?'
  outcome: 'Completes everything (100 %) at lap ratio 0.40, but on different physics, so not comparable: flat out
    everywhere, no braking zones, no real racing line. Shows the grip limit is what makes the problem
    interesting.'
R006:
  why: 'E5, seed 1: train on one track only (Training Ground). Does it overfit?'
  outcome: 'Yes: seen 14 %, unseen 0 %. Fast where it laps (lap ratio 0.92), useless on new tracks.'
R007:
  why: 'E4, seed 1: forward ray shortened to 60 m (rays5_short). Does the car need to see far ahead?'
  outcome: 'Slowest setting: lap ratio 1.26, seen 29 %, unseen 63 %. It brakes late, so it learns to drive slowly
    everywhere.'
R008:
  why: 'E4, seed 1: 9 rays (±10°, ±30°, ±60°, ±90°, 0°) instead of 5. Do more directions help?'
  outcome: 'Best of the overnight runs: lap ratio 0.97, seen 43 %, unseen 63 % (seed 2, R014: 1.03, 64 %, 69 %).
    Led to the narrower rays of R015.'
R009:
  why: 'E3: naive reward (pay for speed in any direction) to show reward hacking.'
  outcome: 'v2: seen 36 %, unseen 63 %, lap ratio 1.14. The reward-hacking demo for the presentation; watch how it
    drives rather than the numbers.'
R010:
  why: 'E1 reference, seed 2 (repeat of R004).'
  outcome: 'v2: seen 43 %, unseen 38 %, lap ratio 1.18: close to seed 1, so differences of ~10 % between single runs
    can be luck.'
R011:
  why: 'E2, seed 2 (repeat of R005): grip limit off.'
  outcome: 'Same as seed 1: 100 % completion, lap ratio 0.40, no racing line.'
R012:
  why: 'E5, seed 2 (repeat of R006): one track only.'
  outcome: 'Same as seed 1: seen 14 %, unseen 0 %, lap ratio 0.91.'
R013:
  why: 'E4, seed 2 (repeat of R007): 60 m forward ray.'
  outcome: 'v2: seen 43 %, unseen 56 %, lap ratio 1.18: slow, like seed 1.'
R014:
  why: 'E4, seed 2 (repeat of R008): 9 rays.'
  outcome: 'v2: seen 64 %, unseen 69 %, lap ratio 1.03: confirms 9 rays beat 5.'
R015:
  outcome: 'Meets the T50 target. @4600k: seen 64 %, unseen 87.5 % (@4800k 93.8 %), lap ratio 0.969: faster than the
    baseline, also on the test maps that earlier models never finished. Still fails Fast Flow and Technical. Its best
    checkpoints were its last ones (still improving at 5M). Not reproduced by seed 2 (R018: 0 % on the test maps) or
    by an 8M run (R019: stuck early), so it is partly a lucky run.'
R016:
  outcome: 'Worse than R015: seen 50 %, unseen 75 %, lap ratio 0.99. Narrow rays beat 9 evenly spread ones on the map
    library.'
R017:
  outcome: 'No gain over its parent R015@4600k: seen 57 %, unseen 88 %, lap ratio 0.97. Fine-tuning on the same tracks
    doesn''t help; a second seed or longer training is the next test.'
R018:
  outcome: 'Does not reproduce R015. Best @3400k: seen 64 % and held-out 100 % like R015, lap ratio 0.998, but 0 % on
    the test maps (R015: 67 %); only 2 of its 50 checkpoints finish any test-map episode (17-33 %). R015''s test-map
    result is seed luck.'
R019:
  outcome: 'Failed to learn: the episode reward plateaued at ~500-600 (R015 > 1700) with about half the episodes ending
    at the barrier, and the policy''s exploration noise collapsed (std 0.04), so it never recovered. Best overall 7 %.
    A different total_steps changes the learning-rate decay from the first update, so "seed 1 again" does not repeat
    R015.'
R020:
  why: 'E10 control: neuroevolution on Training Ground only, 300 generations. Does it memorise one track like PPO did (E5: R006/R012, 0 % unseen)?'
  outcome: 'Yes, it overfits like E5. Best @4015k (v2): seen 14 %, test maps 0 %, held-out 10 %, unseen 6 %, lap ratio 1.02.'
R021:
  why: 'E10 main run, seed 1: neuroevolution (rays7_lean, track limits, 7 training maps, one random map per generation, lap starts on the start line) until the validation plateau.'
  outcome: 'Stopped at generation 919 (46.3M env steps, 45 min), best validation 1.368. Best evaluated checkpoint @46282k (the last one, not the best-validated one): seen 93 %, test maps 50 %, held-out 90 %, unseen 75 %, lap ratio 1.05. Best of 18 evaluated checkpoints, one seed.'
R022:
  why: 'E10 main run, seed 2 (owner T116): one seed can be lucky (PPO R015 vs R018/R019).'
  outcome: 'Stopped at generation 899 (45.3M env steps, 35 min), best validation 1.367. Best evaluated checkpoint @40055k: seen 86 %, test maps 100 %, held-out 90 %, unseen 94 %, lap ratio 1.07. The two seeds differ on the test maps (50 % vs 100 %): single-seed results are not reliable. Best of 18 evaluated checkpoints.'
R023:
  why: 'E10 PPO under GA rules: the same 10 inputs (rays7_lean) and track limits on the same 7 maps, 5M steps like R015, so E10 compares the methods only.'
  outcome: 'Best @1700k: 100 % on seen, test, held-out and unseen, lap ratio 0.975, in 5.0M env steps (46.6 min), about a tenth of the GA runs steps at similar wall-clock. Best of 50 evaluated checkpoints (the max of many noisy checkpoints is optimistic), one seed; R015/R018 showed that PPO results can fail to reproduce.'
R024:
  why: 'Neuroevolution with rays6_narrow: the 0 degree ray replaced by narrow +-1 degree rays (60 m / 200 m ranges as listed in configs/env/sb_rays6_narrow.yaml) and the previous steering and gas as inputs. Does the model sense a curve far ahead with narrow front rays, and do the previous inputs smooth the output?'
  outcome: 'Best of 19 evaluated checkpoints @11999k (v2): seen 86 %, test maps 50 %, held-out 70 %, unseen 62.5 %, lap ratio 1.41, after 36.5M env steps (43 min). Below the E10 GA runs on the same protocol (R021/R022: unseen 75 / 94 %, lap ratio 1.05 / 1.07) and clearly slower. One seed, so a pointer rather than a result.'
R025:
  why: 'Neuroevolution (GA) with 6 rays and the 256x256 network on the 7 training maps (train7), up to 4000 generations, 20 % elites: how far does a bigger search go than R024?'
  outcome: 'Stopped on the validation plateau at generation 1479 (best validation 1.295, first reached around generation 500). Best checkpoint @16640k (v2): seen 50 %, test maps 17 %, held-out 100 %, unseen 69 %, lap ratio 1.24. Plateau patience 500.'
R026:
  why: 'R025 repeated with seed 2, patience 4000 (= the generation cap) and 4 workers, to see whether the GA improves after a long plateau.'
  outcome: 'Ran all 4000 generations (160 min, 4 workers). Best validation 1.2955 (peak 1.298 at generation 1519), no rise after the plateau. Best checkpoint @62770k (v2): seen 36 %, test maps 0 %, held-out 70 %, unseen 44 %, lap ratio 1.20. Led to GA fitness v2 (D31).'
